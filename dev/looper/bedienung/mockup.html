<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hexenring Bedienmodell</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one screen like the app – field on top, the Looper-Leiste in the thumb zone (status line, loops, controls);
   the Schleifen-Blatt slides up from below on a phone and becomes a right-hand column from 900 px. Single dark look, like Myzel. */
:root {
  --bg: #120e0c; --field: #1a1411; --panel: #1f1814; --line: #3d312a;
  --fg: #f0e6d8; --dim: #a8988a; --spore: #ffb35c; --lumen: #86f0d0; --rec: #ff5b4d;
  --f-ui: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 var(--f-ui); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--lumen); outline-offset: 2px; border-radius: 10px; }
.app { height: 100%; display: grid; grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
@media (min-width: 900px) { .app.sheet-on { grid-template-columns: 1fr 380px; } }

/* top bar */
.top { display: flex; align-items: center; gap: 8px; padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); grid-column: 1; }
.logo { letter-spacing: .32em; font-weight: 400; font-size: 15px; color: var(--fg); margin-right: 4px; }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--fg); white-space: nowrap; }
.pill.on { border-color: var(--spore); color: var(--spore); }
.top .sp { flex: 1; }
.mock { font-size: 11px; color: var(--dim); border: 1px dashed var(--line); border-radius: 6px; padding: 2px 6px; white-space: nowrap; }

/* field */
.field { position: relative; background: var(--field); overflow: hidden; grid-column: 1; touch-action: none; user-select: none; }
.field .col { position: absolute; top: 0; bottom: 0; border-left: 1px solid rgba(240,230,216,.05); }
.field .col.root { background: rgba(255,179,92,.05); }
.field .keys { position: absolute; left: 0; right: 0; bottom: 6px; display: flex; font: 11px var(--f-num); color: var(--dim); }
.field .keys span { flex: 1; text-align: center; }
.field .keys span.root { color: var(--spore); }
.field .hint-txt { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); color: rgba(240,230,216,.28); font-size: 14px; text-align: center; pointer-events: none; width: 80%; }
.spark { position: absolute; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: var(--lumen); pointer-events: none; animation: spark 900ms ease-out forwards; }
@keyframes spark { from { transform: scale(1); opacity: .9; } to { transform: scale(5); opacity: 0; } }

/* the Leiste */
.leiste { grid-column: 1; background: var(--panel); border-top: 1px solid var(--line); padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
.status { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; padding: 8px 2px 6px; min-height: 52px; }
.takt { display: flex; gap: 3px; align-items: center; }
.takt i { display: block; width: 18px; height: 3px; border-radius: 2px; background: var(--line); }
.takt i.one { background: rgba(255,179,92,.45); }
.takt i.now { background: var(--fg); height: 5px; }
.takt i.one.now { background: var(--spore); }
.takt.frei i { width: 4px; background: var(--line); }
.taktw { font: 12px var(--f-num); color: var(--dim); white-space: nowrap; }
.say { grid-column: 1 / -1; font-size: 14px; color: var(--fg); min-height: 20px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.say .sub { color: var(--dim); }
.say.rec { color: #ffb0a8; }
.lnk { color: var(--lumen); border: 1px solid rgba(134,240,208,.4); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
.lnk.x { color: var(--dim); border-color: var(--line); }

.loops { display: flex; align-items: flex-start; gap: 4px; padding: 4px 0 2px; border-top: 1px solid rgba(61,49,42,.6); }
.loops .rings { display: flex; gap: 4px; flex: 1; min-width: 0; }
.ring { width: 64px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; position: relative; }
.ring svg { width: 44px; height: 44px; overflow: visible; }
.ring .w { font-size: 12px; color: var(--dim); white-space: nowrap; }
.ring.act .w { color: var(--fg); }
.ring .db { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font: 11px var(--f-num); background: rgba(18,14,12,.9); padding: 1px 4px; border-radius: 4px; pointer-events: none; }
.side { display: flex; gap: 2px; }
.side button { padding: 6px 8px; font-size: 13px; color: var(--dim); display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 52px; }
.side button b { font-size: 20px; line-height: 26px; font-weight: 400; color: var(--fg); }

.ctl { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-top: 6px; }
.ctl .b { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; font-size: 13px; color: var(--fg); position: relative; }
.ctl .b .ic { font-size: 26px; line-height: 30px; }
.ctl .b small { font-size: 11px; color: var(--dim); }
.ctl .b.dim { opacity: .45; }
.haupt { width: 84px; height: 84px; position: relative; display: grid; place-items: center; }
.haupt svg { position: absolute; inset: 0; width: 84px; height: 84px; overflow: visible; }
.haupt .core { width: 60px; height: 60px; border-radius: 50%; background: #2a211c; border: 2px solid var(--dim); display: grid; place-items: center; font: 600 22px var(--f-num); color: var(--fg); transition: background .15s; }
.haupt .core .dot { width: 20px; height: 20px; border-radius: 50%; background: var(--fg); }
.haupt.rec .core { background: var(--rec); border-color: var(--rec); color: #160d0b; }
.haupt.dub .core { border-color: var(--rec); }
.haupt.count .core { border-style: dashed; border-color: var(--rec); color: var(--rec); background: transparent; }
.hw { text-align: center; font-size: 13px; margin-top: 2px; min-height: 18px; }

/* the sheet */
.sheet { position: fixed; left: 0; right: 0; bottom: var(--leiste-h, 0px); max-height: calc(100% - var(--leiste-h, 0px) - 64px); background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; transform: translateY(102%); transition: transform .22s ease; display: flex; flex-direction: column; z-index: 20; box-shadow: 0 -10px 40px rgba(0,0,0,.5); }
.sheet.open { transform: none; }
.sheet:not(.open) { visibility: hidden; transition: transform .22s ease, visibility 0s .22s; }
.leiste { position: relative; z-index: 25; }
@media (min-width: 900px) { .sheet { position: static; grid-column: 2; grid-row: 1 / 4; max-height: none; border-radius: 0; border-top: 0; border-left: 1px solid var(--line); transform: none; display: none; box-shadow: none; } .sheet.open { display: flex; } }
.sh-h { display: flex; align-items: center; gap: 6px; padding: 10px max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px)); }
.tabs { display: flex; gap: 4px; flex: 1; overflow-x: auto; scrollbar-width: none; }
.tab { border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; white-space: nowrap; color: var(--dim); }
.tab.on { border-color: var(--fg); color: var(--fg); }
.round { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); flex: none; }
.sh-b { overflow-y: auto; padding: 4px max(14px, env(safe-area-inset-right, 0px)) 24px max(14px, env(safe-area-inset-left, 0px)); }
.sh-b h3 { margin: 6px 0 2px; font-size: 18px; font-weight: 600; text-wrap: balance; }
.meta { font: 12px var(--f-num); color: var(--dim); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0; }
.row .lab { width: 100%; font-size: 12px; color: var(--dim); letter-spacing: .04em; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.chip.on { background: var(--fg); color: #160d0b; border-color: var(--fg); }
.chip.big { padding: 10px 16px; }
.chip.warn { border-color: rgba(255,91,77,.6); color: #ffb0a8; }
.chip.ok { border-color: rgba(134,240,208,.5); color: var(--lumen); }
.note { font-size: 13px; color: var(--dim); margin: 2px 0 8px; max-width: 60ch; }
input[type=range] { width: 100%; accent-color: var(--spore); }
.grp { border-top: 1px solid var(--line); }
.grp > button { width: 100%; text-align: left; padding: 12px 0; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
.grp > button b { font-weight: 600; font-size: 15px; }
.grp > button span { grid-column: 1; font-size: 13px; color: var(--dim); }
.grp > button i { grid-row: 1 / 3; grid-column: 2; font-style: normal; color: var(--dim); align-self: center; transition: transform .15s; }
.grp.open > button i { transform: rotate(90deg); }
.grp .in { display: none; padding-bottom: 10px; }
.grp.open .in { display: block; }
.myz { font-size: 11px; color: var(--dim); font-style: italic; }
.lay { display: flex; gap: 8px; align-items: center; font-size: 14px; padding: 4px 0; }
.lay span { flex: 1; }

/* hints and toasts */
.bubble { pointer-events: none; position: fixed; z-index: 30; max-width: 260px; background: var(--fg); color: #160d0b; border-radius: 12px; padding: 10px 12px; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
.bubble::after { content: ""; position: absolute; left: var(--ax, 50%); bottom: -7px; width: 14px; height: 14px; margin-left: -7px; background: var(--fg); transform: rotate(45deg); }
.bubble button { pointer-events: auto; margin-top: 6px; font-size: 13px; text-decoration: underline; color: #160d0b; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(64px + env(safe-area-inset-top, 0px)); z-index: 40; background: #2b221d; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; font-size: 14px; max-width: calc(100% - 32px); }
.toast button { color: var(--lumen); font-weight: 600; }
.help { position: fixed; inset: 0; z-index: 50; background: rgba(10,8,7,.82); display: grid; place-items: center; padding: 16px; }
.help > div { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; max-width: 520px; max-height: 86%; overflow-y: auto; padding: 16px 18px; }
.help h2 { margin: 0 0 8px; font-size: 20px; }
.help dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; }
.help dt { font: 13px var(--f-num); color: var(--spore); }
.help dd { margin: 0; }
@media (prefers-reduced-motion: reduce) { .spark { animation: none; opacity: 0; } .sheet { transition: none; } }
@media (max-width: 380px) { .ring { width: 54px; } .side button { min-width: 44px; padding: 6px 4px; } .mock { display: none; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <span class="logo">MYZEL</span>
    <span class="pill">≋ Nebel</span>
    <span class="sp"></span>
    <span class="mock" title="Nur die Bedienung, kein Klang">Mockup · ohne Ton</span>
    <button type="button" class="pill" id="puls" aria-pressed="false" title="Puls an/aus (gibt einen Takt)">▶ Puls</button>
  </header>

  <main class="field" id="field" aria-label="Spielfeld: tippen spielt einen Ton (hier nur sichtbar)">
    <div class="hint-txt" id="fieldHint">Spielfeld · tippen = ein Ton (im Mockup nur ein Lichtpunkt)</div>
    <div class="keys" id="keys"></div>
  </main>

  <section class="leiste" aria-label="Looper">
    <div class="status" id="status">
      <div class="takt" id="takt" aria-hidden="true"></div>
      <div class="taktw" id="taktw"></div>
      <div class="say" id="say" role="status" aria-live="polite"></div>
    </div>
    <div class="loops">
      <div class="rings" id="rings"></div>
      <div class="side">
        <button type="button" id="formBtn" title="Form: Abschnitte (F)"><b><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 5l2-3 2 3zM10 3l1-2.5 1 2.5zM17 5l2-3 2 3z" fill="#a8988a"/></svg></b>Form</button>
        <button type="button" id="moreBtn" title="Alle Einstellungen der Schleifen (Umschalt + Zahl)"><b>☰</b>Mehr</button>
      </div>
    </div>
    <div class="ctl">
      <button type="button" class="b" id="undo" title="Zurück (Strg+Z) · halten: alles leeren"><span class="ic">↶</span>Zurück<small id="undoSub">&nbsp;</small></button>
      <div>
        <button type="button" class="haupt" id="haupt" title="Aufnehmen (Leertaste)">
          <svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="38" fill="none" stroke="#3d312a" stroke-width="3"/><circle id="hRing" cx="42" cy="42" r="38" fill="none" stroke="#ff5b4d" stroke-width="4" stroke-linecap="round" transform="rotate(-90 42 42)" stroke-dasharray="0 999"/><circle id="hHead" cx="42" cy="4" r="4" fill="#ffb35c" opacity="0"/></svg>
          <span class="core" id="hCore"><span class="dot"></span></span>
        </button>
        <div class="hw" id="hw">Aufnehmen</div>
      </div>
      <button type="button" class="b" id="korb" title="Übernehmen, was du gerade gespielt hast (E)"><span class="ic">⤓</span>Übernehmen<small id="korbSub">nichts gespielt</small></button>
    </div>
  </section>

  <aside class="sheet" id="sheet" aria-label="Schleifen-Blatt">
    <div class="sh-h"><div class="tabs" id="tabs" role="tablist"></div><button type="button" class="round" id="helpBtn" title="Hilfe (?)">?</button><button type="button" class="round" id="closeBtn" title="Schließen (Esc)">✕</button></div>
    <div class="sh-b" id="sheetBody"></div>
  </aside>
</div>

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const now = () => performance.now() / 1000;
const RED = '#ff5b4d', SPORE = '#ffb35c', LUMEN = '#86f0d0', HYPHA = '#f0e6d8', DIM = '#a8988a', LINE = '#3d312a';
const store = { get(k) { try { return JSON.parse(localStorage.getItem('hxMock.' + k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem('hxMock.' + k, JSON.stringify(v)); } catch (e) {} } };

// ---- state ----
const S = {
  puls: false, bpm: 96, T0: 0, bar: 2.5,          // the grid: origin and bar length (4 beats)
  takt: false,                                     // a grid exists (Puls on, or the first loop gave one)
  loops: [], nextId: 1, active: 0,                 // loops: {id, n, start, len, layers, state, pend, db, o}
  R: null,                                         // a recording: {kind:'new'|'dub', loop, phase:'count'|'rec'|'close', at, t0, closeAt, auto}
  plays: [],                                       // field taps (times) – what Übernehmen could take
  hist: [], redo: [], lich: [], lichCur: null, lichPend: null, schluss: null,
  msg: null, offer: null, sheet: null, tab: 'loop', grp: {}, seen: store.get('seen') || {},
};
const MAXR = () => (innerWidth >= 700 ? 8 : 4);

// ---- the field ----
const NOTES = ['D3','F3','G3','A3','C4','D4','F4','G4','A4','C5','D5'];
const field = $('#field');
NOTES.forEach((n, i) => { const c = document.createElement('div'); c.className = 'col' + (n[0] === 'D' ? ' root' : ''); c.style.left = (i / NOTES.length * 100) + '%'; c.style.width = (100 / NOTES.length) + '%'; field.append(c); const k = document.createElement('span'); k.textContent = n; if (n[0] === 'D') k.className = 'root'; $('#keys').append(k); });
field.addEventListener('pointerdown', (e) => {
  const r = field.getBoundingClientRect(), d = document.createElement('div');
  d.className = 'spark'; d.style.left = (e.clientX - r.left) + 'px'; d.style.top = (e.clientY - r.top) + 'px'; field.append(d); setTimeout(() => d.remove(), 950);
  S.plays.push(now()); $('#fieldHint').hidden = true;
  if (!S.loops.length && !S.R && S.plays.length === 4) hint('korb');
});

// ---- the clock ----
function gridOn() { return S.puls || S.takt; }
function nextOne(t, min = 0.35) { if (!gridOn()) return t; let k = Math.ceil((t - S.T0 + min) / S.bar); return S.T0 + k * S.bar; }
function barNo(t) { return Math.floor((t - S.T0) / S.bar) + 1; }
function beatIn(t) { return Math.floor(((t - S.T0) % S.bar + S.bar) % S.bar / (S.bar / 4)); }
function lenText(L) { if (L.bars) return L.bars + (L.bars === 1 ? ' Takt' : ' Takte'); return L.len.toFixed(1).replace('.', ',') + ' s'; }

// ---- saying things: always visible in the status line (4 s), and to screen readers ----
function say(text, o = {}) { S.msg = { text, until: now() + (o.s || 4), act: o.act || null, cls: o.cls || '' }; drawStatus(true); }
function toast(text, act) {
  document.querySelectorAll('.toast').forEach((x) => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
  const s = document.createElement('span'); s.textContent = text; t.append(s);
  if (act) { const b = document.createElement('button'); b.type = 'button'; b.textContent = act.label; b.onclick = () => { t.remove(); act.fn(); }; t.append(b); }
  document.body.append(t); setTimeout(() => t.remove(), 5000);
}

// ---- history: every step can be taken back ----
function hist(label, undo, redo) { S.hist.push({ label, undo, redo }); S.redo.length = 0; }
function undoStep() {
  if (S.R) { const k = S.R.kind; S.R = null; say(k === 'dub' ? 'Schicht abgebrochen' : 'Aufnahme abgebrochen'); return; }
  const p = S.loops.find((L) => L.pend); if (p) { p.pend = null; say('Abgebrochen: Schleife ' + p.n + ' bleibt, wie sie ist'); return; }
  const h = S.hist.pop(); if (!h) { say('Nichts zum Zurücknehmen'); return; }
  h.undo(); S.redo.push(h);
  toast('Zurückgenommen: ' + h.label, { label: 'Wiederholen', fn: redoStep }); say('Zurückgenommen: ' + h.label);
  renderAll();
}
function redoStep() { const h = S.redo.pop(); if (!h) return; h.redo(); S.hist.push(h); say('Wiederholt: ' + h.label); renderAll(); }

// ---- loops ----
function freeSlot() { const used = new Set(S.loops.map((L) => L.n)); for (let n = 1; n <= 8; n++) if (!used.has(n)) return n; return 0; }
function addLoop(L) { S.loops.push(L); S.loops.sort((a, b) => a.n - b.n); S.active = L.id; }
function dropLoop(L) { S.loops = S.loops.filter((x) => x !== L); if (S.active === L.id) S.active = S.loops.length ? S.loops[S.loops.length - 1].id : 0; if (!S.loops.length && !S.puls) S.takt = false; }
function makeLoop(start, len, kind) {
  const n = freeSlot(); if (!n) { say('Alle acht Plätze sind belegt – lösche eine Schleife im Blatt'); return null; }
  const first = !S.loops.length;
  if (first && !S.puls) { const bars = Math.max(1, Math.round(len / 2.5)); S.takt = true; S.T0 = start; S.bar = len / bars; S.bpm = Math.round(240 / S.bar * 10) / 10; }
  const bars = gridOn() ? Math.max(1, Math.round(len / S.bar)) : 0;
  const L = { id: S.nextId++, n, start, len: bars ? bars * S.bar : len, bars, layers: [kind], state: 'spielt', pend: null, db: 0, o: { wied: 'genau', leb: 0, ton: 'folgt', eff: 'fest', tau: 'mit', band: '1', naehr: {}, rolle: 'auto', platz: true, wk: false } };
  addLoop(L);
  hist('Schleife ' + n + ' aufgenommen', () => dropLoop(L), () => addLoop(L));
  return L;
}
function activeLoop() { return S.loops.find((L) => L.id === S.active) || null; }

// ---- the big button ----
function haupt() {
  const t = now();
  if (S.R) {
    const R = S.R;
    if (R.phase === 'count') { S.R = null; say('Einzählen abgebrochen'); return; }
    if (R.phase === 'rec') {
      if (R.kind === 'new' && !S.loops.length && !S.puls) { closeRec(t); return; }
      R.phase = 'close'; R.closeAt = gridOn() ? nextOne(t, 0.1) : t; say(gridOn() ? 'Schließt auf der 1 (Takt ' + barNo(R.closeAt) + ')' : 'Schließt'); return;
    }
    if (R.phase === 'close') { R.phase = 'rec'; R.closeAt = null; say('Nimmt weiter auf'); return; }
  }
  const A = activeLoop();
  if (!A) { startRec('new'); hint('first-close'); return; }
  startRec('dub', A);
}
function startRec(kind, L) {
  const t = now(), at = gridOn() ? nextOne(t, 0.6) : t;
  S.R = { kind, loop: L ? L.id : 0, phase: at > t ? 'count' : 'rec', at, t0: at, closeAt: null, mult: 1 };
  if (kind === 'new' && S.loops.length) S.R.auto = true;   // a second loop closes after the first's length
  if (S.R.phase === 'count') say(kind === 'dub' ? 'Schicht auf Schleife ' + L.n + ' beginnt auf der 1' : 'Aufnahme beginnt auf der 1');
  else say(kind === 'dub' ? 'Schicht auf Schleife ' + L.n + ' läuft' : 'Nimmt auf');

// ---- Übernehmen (Korb) ----

}
function korb() {

}

// ---- a ring: tap = stumm/an (at the next 1 with a grid), hold = its sheet, drag = level ----

  korb: ['#korb', 'Gerade etwas Schönes gespielt? Übernehmen nimmt es nachträglich.'],
  'first-loop': ['#haupt', 'Noch einmal ● legt eine Schicht darüber.'],
  ring: ['.ring[data-id]', 'Tipp: stumm oder an. Ziehen: lauter oder leiser. Halten: Einstellungen.'],
  plus: ['#plus', '+ beginnt eine neue Schleife – mit Takt zählt sie ein.'],
  more: ['#moreBtn', 'Hier kannst du jede Schleife verwandeln und lebendig machen.'],
};
const ORDER = { 'first-close': null, 'first-loop': ['first-loop', 'ring'], 'ring-done': ['plus'], 'plus-done': ['more'], 'hold-done': null, 'sheet-open': null };
let bubble = null, queue = [];
function hint(k) {
  const list = ORDER[k] !== undefined ? ORDER[k] : [k];
  if (k === 'sheet-open') { S.seen.more = 1; store.set('seen', S.seen); if (bubble && bubble.k === 'more') killBubble(); return; }
  if (k === 'ring-done') { S.seen.ring = 1; store.set('seen', S.seen); if (bubble && bubble.k === 'ring') killBubble(); }
  if (k === 'first-close') { S.seen.start = 1; store.set('seen', S.seen); if (bubble && bubble.k === 'start') killBubble(); return; }
  if (k === 'plus-done') { S.seen.plus = 1; store.set('seen', S.seen); if (bubble && bubble.k === 'plus') killBubble(); }
  if (!list) return;
  for (const x of list) if (!S.seen[x] && !queue.includes(x)) queue.push(x);
  setTimeout(nextBubble, 400);
}
function killBubble() { if (bubble) { bubble.el.remove(); bubble = null; } setTimeout(nextBubble, 300); }
function nextBubble() {
  if (bubble || !queue.length) return;
  const k = queue.shift(); if (S.seen[k]) return nextBubble();
  const target = document.querySelector(HINTS[k][0]); if (!target) return;
  S.seen[k] = 1; store.set('seen', S.seen);
  const b = el('div', { cls: 'bubble', role: 'note' }, HINTS[k][1], el('br'), el('button', { type: 'button', on: killBubble }, 'Verstanden'));
  document.body.append(b);
  const r = target.getBoundingClientRect(), bw = Math.min(260, innerWidth - 24), x = Math.max(12, Math.min(innerWidth - bw - 12, r.left + r.width / 2 - bw / 2));
  b.style.width = bw + 'px'; b.style.left = x + 'px'; b.style.top = Math.max(8, r.top - b.offsetHeight - 12) + 'px'; b.style.setProperty('--ax', (r.left + r.width / 2 - x) + 'px');
  bubble = { k, el: b }; setTimeout(() => { if (bubble && bubble.k === k) killBubble(); }, 9000);
}

function renderAll() { renderRings(); renderSheet(); const lh = document.querySelector('.leiste').offsetHeight; document.documentElement.style.setProperty('--leiste-h', (innerWidth >= 900 ? 0 : lh) + 'px'); }
renderAll();
addEventListener('resize', renderAll);
requestAnimationFrame(tick);
hint('start');
})();
</script>
