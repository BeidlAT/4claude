# Baut die installierbare Offline-App aus myzel/ und veröffentlicht sie auf GitHub Pages
# (https://beidlat.github.io/4claude/). Voraussetzung: Settings → Pages → Source: "GitHub Actions".
name: Myzel veröffentlichen

on:
  push:
    branches: [ccr-c7c5d0a6-cus3ip, main]   # (the default branch only: the github-pages environment deploys from it alone; a session's work comes in by a merged pull request)
    paths: ['myzel/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: App bauen
        run: python3 myzel/pwa/build.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
