<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sphärenwerk</title>
<meta name="description" content="Eine mystische Maschine für Sphärenmusik: Flächen, Schlagwerk und Stimme, verkabelt wie ein Modularsystem.">
<meta name="theme-color" content="#0a0d17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sphärenwerk">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="bar">
    <button type="button" id="btnMenu" class="brand" aria-haspopup="true" aria-label="Menü öffnen">
      <svg class="brand-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.8 12a9.2 4.2 0 1 0 18.4 0a9.2 4.2 0 1 0 -18.4 0 M9.6 12a2.4 2.4 0 1 0 4.8 0a2.4 2.4 0 1 0 -4.8 0 M18.6 8.2a1.2 1.2 0 1 0 2.4 0a1.2 1.2 0 1 0 -2.4 0"/></svg>
      <span class="brand-name">Sphärenwerk</span>
      <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
    </button>
    <button type="button" id="chipSkala" class="chip-btn" aria-label="Tonleiter wählen"></button>
    <button type="button" id="chipTempo" class="chip-btn" aria-label="Tempo einstellen"></button>
    <span class="bar-gap"></span>
    <button type="button" class="lamp b-hold" aria-pressed="false" title="Halten (Leertaste)"><i class="lamp-l"></i><span class="lbl">Halten</span></button>
    <button type="button" class="lamp b-mic" aria-pressed="false" title="Mikrofon (M)"><i class="lamp-l"></i><span class="lbl">Mikro</span></button>
    <span class="rec-pair">
      <button type="button" class="lamp b-rec" data-state="idle" title="Aufnahme (R)"><i class="lamp-l"></i><span class="lbl">Aufnahme</span></button>
      <button type="button" class="icon-btn b-recset" aria-label="Aufnahme einstellen und Aufnahmen ansehen" title="Aufnahmen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16 M4 12h16 M4 17h10"/></svg></button>
    </span>
    <button type="button" id="btnPad" class="lamp b-pad" title="Pad im Vollbild (P)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5 M15 4h5v5 M20 15v5h-5 M9 20H4v-5"/></svg><span class="lbl">Pad</span></button>
  </header>

  <main id="main">
    <div id="werk" aria-label="Werkbank">
      <div id="bench"></div>
      <canvas id="cables" aria-hidden="true"></canvas>
      <div class="wtools" role="toolbar" aria-label="Werkbank">
        <button type="button" id="wUndo" class="icon-btn" aria-label="Rückgängig" title="Rückgängig"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5 M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
        <button type="button" id="wRedo" class="icon-btn" aria-label="Wiederholen" title="Wiederholen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5 M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
        <i class="wsep"></i>
        <button type="button" id="wOut" class="icon-btn" aria-label="Verkleinern" title="Verkleinern"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <button type="button" id="wIn" class="icon-btn" aria-label="Vergrößern" title="Vergrößern"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14 M12 5v14"/></svg></button>
        <button type="button" id="wFit" class="icon-btn" aria-label="Ganze Maschine zeigen" title="Ganze Maschine zeigen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5 M15 4h5v5 M20 15v5h-5 M9 20H4v-5 M9 9h6v6H9Z"/></svg></button>
        <button type="button" id="wArrange" class="icon-btn" aria-label="Organe ordnen" title="Organe auf den Schirm ordnen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4Z M13 4h7v7h-7Z M4 13h7v7H4Z M13 13h7v7h-7Z"/></svg></button>
      </div>
    </div>
    <div id="miniWrap">
      <div id="mini"></div>
      <button type="button" id="miniBig" class="mini-big" aria-label="Pad im Vollbild">Pad im Vollbild</button>
    </div>
  </main>
</div>

<section id="padView" hidden aria-label="Pad im Vollbild">
  <nav id="strip" aria-label="Pad-Steuerung">
    <button type="button" id="sWerk" class="sbtn" aria-label="Zurück zur Werkbank"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.4 12a4.6 4.6 0 1 0 9.2 0a4.6 4.6 0 1 0 -9.2 0 M12 2.4v3.2 M12 18.4v3.2 M2.4 12h3.2 M18.4 12h3.2 M5.2 5.2l2.3 2.3 M16.5 16.5l2.3 2.3 M5.2 18.8l2.3-2.3 M16.5 7.5l2.3-2.3"/></svg><span class="lbl">Werk</span></button>
    <button type="button" class="lamp big b-hold" aria-pressed="false"><i class="lamp-l"></i><span class="lbl">Halten</span></button>
    <button type="button" id="sGhost" class="lamp g-ghost" aria-pressed="false" title="Tippen: Geist aufnehmen · lange drücken: alle Geister weg"><i class="lamp-l"></i><span class="lbl">Geist</span></button>
    <button type="button" class="lamp b-mic" aria-pressed="false"><i class="lamp-l"></i><span class="lbl">Mikro</span></button>
    <button type="button" class="lamp b-rec" data-state="idle"><i class="lamp-l"></i><span class="lbl">Aufnahme</span></button>
    <button type="button" id="sRelease" class="sbtn"><span class="lbl">Alles lösen</span></button>
    <span class="sgap"></span>
    <label class="smag" for="sMagnet"><span class="lbl">Magnet</span><output id="sMagnetV">70 %</output>
      <input type="range" id="sMagnet" min="0" max="100" step="1" value="70" aria-label="Magnet: wie stark Töne einrasten"></label>
    <button type="button" id="sRows" class="sbtn small"><span class="lbl">Fläche</span></button>
    <button type="button" id="sRange" class="sbtn small"><span class="lbl">3 Oktaven</span></button>
    <div class="soct">
      <button type="button" id="sOctDown" class="icon-btn" aria-label="Eine Oktave tiefer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span id="sOct" class="num">ab D2</span>
      <button type="button" id="sOctUp" class="icon-btn" aria-label="Eine Oktave höher"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </nav>
  <div id="padHost"></div>
</section>

<div id="start" role="dialog" aria-modal="true" aria-labelledby="startTitle">
  <div class="start-in">
    <svg class="astro" viewBox="0 0 200 200" aria-hidden="true">
      <g class="astro-r1"><circle cx="100" cy="100" r="92"/><circle cx="100" cy="100" r="84"/><path d="M100 8v10 M100 182v10 M8 100h10 M182 100h10 M35 35l7 7 M158 158l7 7 M35 165l7-7 M158 42l7-7"/></g>
      <g class="astro-r2"><ellipse cx="100" cy="100" rx="66" ry="30"/><circle cx="166" cy="100" r="4" class="pl"/><circle cx="34" cy="100" r="2.5" class="pl"/></g>
      <g class="astro-r3"><ellipse cx="100" cy="100" rx="44" ry="44"/><circle cx="100" cy="56" r="3.5" class="pl"/></g>
      <circle cx="100" cy="100" r="9" class="sun"/>
    </svg>
    <h1 id="startTitle">Sphärenwerk</h1>
    <p class="start-sub">Eine Maschine für Sphärenmusik</p>
    <p class="start-text">Flächen aus Licht, gestimmtes Schlagwerk und deine Stimme, verbunden mit Kabeln, Drehreglern und Planeten. Alles liegt im Raster einer Tonleiter.</p>
    <button type="button" id="btnAwaken" class="btn primary big">Maschine erwecken</button>
    <p id="startNote" class="start-note"></p>
  </div>
</div>

<div id="resume" hidden><button type="button" id="btnResume" class="btn primary">Klang fortsetzen</button></div>
<div id="sheet" hidden></div>
<div id="oracle" hidden></div>
<div id="pop" hidden role="dialog"></div>
<div id="bubble" hidden aria-hidden="true"></div>
<div id="toast" hidden role="status" aria-live="polite"></div>

<script src="js/util.js"></script>
<script src="js/scale.js"></script>
<script src="js/defs.js"></script>
<script src="js/machine.js"></script>
<script src="js/rituale.js"></script>
<script src="js/ui.js"></script>
<script src="js/audio.js"></script>
<script src="js/displays.js"></script>
<script src="js/werk.js"></script>
<script src="js/pad.js"></script>
<script src="js/recorder.js"></script>
<script src="js/oracle.js"></script>
<script src="js/main.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
